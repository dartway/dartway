name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Forks cannot read repository secrets, so the review would fail on auth.
    if: ${{ github.event.pull_request.head.repo.fork != true && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the changes in this pull request (diff against its base branch, `${{ github.event.pull_request.base.ref }}`).

            This repository is the DartWay framework itself — a Dart monorepo of
            the framework's server, client and Flutter packages, its CLI, the
            project template, a reference example, the docs and the agent
            toolkit — not an application built on it. Read `CLAUDE.md` at the
            repository root for the conventions that apply; `docs/DESIGN.md` is
            the law for public API design, and `docs/1.0/DECISIONS.md` records
            the decisions of the rewrite (the latest entry wins).

            Do not comment on generated or platform files: `**/*.dw.dart`,
            `**/lib/generated/**`, `**/test/goldens/**`, `**/l10n/gen/**`,
            `*.g.dart`, `*.freezed.dart`, `*.mocks.dart`; iOS/Android project
            files (`*.pbxproj`, `*.xcconfig`, `*.xcscheme`, `*.plist`,
            `*.entitlements`, `Podfile.lock`, `Runner.xcodeproj/**`); lockfiles
            and assets (`pubspec.lock`, `*.lock`, `*.png`, `*.jpg`, `*.svg`,
            `*.webp`). Migrations under `**/lib/src/migrations/**` are hand-reviewed
            code: read them. Focus on hand-written Dart.

            Look for: bugs and logic errors, null-safety and typing problems, races
            and unintended side effects, security issues. Report only findings you
            are confident about.

            Four checks specific to this repository, in addition to the above:

            1. **The synchronisation law.** A change to the public API of any package
               (what its `lib/<library>.dart` exports) is incomplete until the same
               PR updates `example/`, `template/`, the affected skills in
               `toolkit/skills/` and `toolkit/CLAUDE.md`, the affected pages in
               `docs/`, and the package `CHANGELOG.md`; a version bump brings the
               carets in `example/` and `template/` along (the core family —
               `dartway_core_shared`, `dartway_core_server`, `dartway_core_flutter`,
               `dartway_orm`, `dartway_client`, `dartway_generator` — moves in
               lockstep; satellites version on their own). Flag whichever is
               missing.

            2. **Generated code is up to date.** A change to a DTO or row class in
               `example/` or `template/`, or to `packages/dartway_generator`, must
               come with the regenerated `*.dw.dart` parts and
               `lib/generated/dw_protocol.dart` / `dw_schema.dart` in the same PR,
               shared and server together. A hand edit to a generated file is a
               blocking finding (the next `dartway generate` overwrites it). A row
               class change that alters the schema without a new migration under
               `lib/src/migrations/` is a blocking finding, and so is an edit to a
               migration that already exists on the base branch — migrations are
               appended, never rewritten (the framework's own included, in
               `packages/dartway_core_server/lib/src/migrations/`).

            3. **A wire change bumps the protocol (D-052).** If the diff changes how
               anything travels between a server and its clients — `DwHttpContract`
               paths, headers or query parameters, `DwApiResponse` bodies or HTTP
               statuses, `DwUpdateTransport` / `DwChannelUpdates`, the live messages
               or close codes, the JSON of the framework's DTOs, or what the
               generator writes into `toJson` / `$NameFromJson` — then
               `dwProtocolVersion` must be bumped and
               `packages/dartway_core_shared/test/goldens/wire_golden.dart` refreshed
               in the same PR. A changed golden with an unchanged
               `dwProtocolVersion` is a blocking finding.

            4. **The toolkit invariant.** `toolkit/` must carry no project
               literals — only `__*__` tokens (`__SHARED_PKG__`, `__SERVER_PKG__`,
               `__FLUTTER_PKG__`, …). Flag any concrete project, package or domain
               name introduced under `toolkit/` — including names from `example/`
               or `template/` (`dartway_example`, `dartway_starter`) and names of
               applications built on the framework. Read the diff; no list of names
               is complete.

            Use mcp__github_inline_comment__create_inline_comment (with
            confirmed: true) for line-level remarks. Use `gh pr comment` for the
            summary. Say so in the summary comment if the change is clean. Publish
            only through GitHub comments — do not emit the review as a chat message.

            Write the review in English: this repository is public.
          # No --model on purpose: the action picks one the account is entitled
          # to. Pin one only after a live run proves it works.
          #
          # When a run fails with a bare `is_error` and no reason, the action is
          # hiding Claude's output. Add `show_full_output: true` here, re-run,
          # read the `result` field — and take the flag back out: this
          # repository is public and so are its run logs.
          claude_args: |
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
