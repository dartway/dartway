name: Kamal config

on:
  pull_request:
    paths:
      - 'packages/dartway_cli/**'
      - 'template/**'
      - '.github/workflows/kamal.yml'
  push:
    branches: [master]
    paths:
      - 'packages/dartway_cli/**'
      - 'template/**'
      - '.github/workflows/kamal.yml'

permissions:
  contents: read

jobs:
  config:
    runs-on: ${{ fromJSON(vars.DW_CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Create and resolve a project from this checkout
        env:
          GIT_AUTHOR_NAME: Config proof
          GIT_AUTHOR_EMAIL: config-proof@example.com
          GIT_COMMITTER_NAME: Config proof
          GIT_COMMITTER_EMAIL: config-proof@example.com
        run: |
          dart pub global activate --source path packages/dartway_cli
          mkdir -p "$RUNNER_TEMP/kamal"
          cd "$RUNNER_TEMP/kamal"
          dartway create kamalcheck --framework-path "$GITHUB_WORKSPACE"
          cd kamalcheck/kamalcheck_flutter
          flutter pub get
      - name: Configure the project and generate its environment-free contract
        run: |
          cd "$RUNNER_TEMP/kamal/kamalcheck"
          cat > deploy/config.yaml <<'YAML'
          kamal:
            repo: git@github.com:acme/kamalcheck.git
            storage: true
          YAML
          cd kamalcheck_flutter
          dart run dartway_cli:dartway deploy kamal
          dart run dartway_cli:dartway deploy kamal --check
          if ls ../deploy/kamal/*.*.yml 2>/dev/null; then
            echo "destination files were generated" >&2
            exit 1
          fi
      - name: Validate every service in three environments with Kamal 2.12
        run: |
          cd "$RUNNER_TEMP/kamal/kamalcheck"
          mkdir -p .kamal
          cat > .kamal/secrets-common <<'SECRETS'
          KAMAL_REGISTRY_PASSWORD=config-proof
          DW_DATABASE_PASSWORD=config-proof
          DW_DATABASE_HOST=config-proof
          DW_DATABASE_PORT=config-proof
          DW_DATABASE_NAME=config-proof
          DW_DATABASE_USER=config-proof
          DW_STORAGE_ACCESS_KEY=config-proof
          DW_STORAGE_SECRET_KEY=config-proof
          SECRETS
          # name host domain bundled-storage bundled-database
          while read -r env host domain storage database; do
            services="api web"
            if [ "$storage" = true ]; then services="storage $services"; fi
            for service in $services; do
              # The runner's empty destination file (deploy/studio.yml > kamal).
              [ -f "deploy/kamal/$service.$env.yml" ] || echo '{}' > "deploy/kamal/$service.$env.yml"
              docker run --rm -v "$PWD:/work:ro" -w /work \
                -e STUDIO_ENVIRONMENT="$env" -e STUDIO_HOST="$host" \
                -e STUDIO_SSH_USER=root \
                -e STUDIO_DOMAIN_API="api.$domain" -e STUDIO_DOMAIN_APP="app.$domain" \
                -e STUDIO_DOMAIN_FILES="files.$domain" \
                -e STUDIO_BUNDLED_STORAGE="$storage" -e STUDIO_BUNDLED_DATABASE="$database" \
                -e DW_TRUSTED_PROXY_NETWORKS=172.18.0.0/16 \
                -e DW_STORAGE_ENDPOINT="https://s3.$domain" \
                ghcr.io/basecamp/kamal:v2.12.0 \
                config -c "deploy/kamal/$service.yml" -d "$env"
            done
          done <<'ENVIRONMENTS'
          stage 203.0.113.10 stage.example.com false true
          prod 203.0.113.20 example.com false false
          prod-ae 203.0.113.30 example.ae true true
          ENVIRONMENTS
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Render the contract with Kamal's own configuration classes
        working-directory: packages/dartway_cli
        run: |
          gem install kamal -v 2.12.0 --no-document
          dart test -t kamal --run-skipped test/kamal_erb_test.dart
      - name: Verify native runtime checks through the masked transport
        working-directory: packages/dartway_cli
        run: dart test -t docker --run-skipped test/kamal_runtime_docker_test.dart
