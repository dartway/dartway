name: Images

# Build the two Docker images a new project ships with — from what
# `dartway create` actually produces, not from `template/` as it sits here.
#
# The distinction is the whole point. `template/` in this repository carries
# `dependency_overrides` pointing at `../../packages/...`, outside any build
# context a Dockerfile can have; `dartway create` strips that block on the way
# out. So `docker build` on `template/` fails inside `dart pub get` for a
# reason that has nothing to do with images, and proves nothing about the
# artefact anyone receives.
#
# What the build then resolves against is a second question, and for a while it
# shared this job with the first one. The images were built from pub.dev, which
# made every run also an answer to "is the last release installable" — and made
# the job red by construction for the whole window between a version bump and
# its release. A minor bump under a zero major puts the skeleton's carets past
# anything published (`^0.13.0` against `0.12.1`), so the build cannot resolve
# and says nothing about images while it is red. That is a gate red by design,
# which is why `self_check` is deliberately kept out of CI.
#
# So the questions are split. This job answers "does *this tree* produce a
# project whose images build": `tool/vendor_framework.dart` puts this commit's
# packages inside the created project and overrides onto them, exactly as a
# project developed against a local checkout does. "Is what a stranger receives
# installable" belongs to `tool/caret_check.dart`, which asks pub.dev directly
# and is the only thing that should go red when a release lags (#143, #255).
#
# Why a build at all, when `dartway deploy check` already compares the three
# copies of the package list: a static comparison is not a build. #177 was a
# skeleton whose *both* images failed at their first `COPY`, because
# `.dockerignore` never admitted a package both Dockerfiles copy — every project
# `dartway create` produced could not be deployed, and nothing noticed.
# `web-compile.yml` compiles the Flutter web target from source, not from the
# image. The images were built only by `dartway deploy`, on a server, by a
# person. A comparison of `COPY` lines says nothing about a base image that
# moved, a `RUN` that fails, or a `dart compile exe` that stopped working.
#
# Nothing here is a required check — `protect-trunk` requires none — so a red
# run reports and does not block. That is deliberate for now: this job has never
# run, and a gate is worth making blocking after it has been watched, not
# before.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      # What the produced project is made of, and what produces it. `toolkit/`
      # is deliberately absent: it is installed into the project's `.claude/`
      # and never reaches an image, and it changes often enough that including
      # it would run this on diffs that cannot affect the result. The nightly
      # run below covers it within a day.
      - 'template/**'
      - 'packages/dartway_cli/**'
      - '.github/workflows/images.yml'
  push:
    branches: [master]
    paths:
      - 'template/**'
      - 'packages/dartway_cli/**'
      - '.github/workflows/images.yml'
  # A daily run: the images are built from base images and a toolchain that
  # move without this repository changing at all, and a build that stopped
  # working is worth hearing about on the day rather than during a promotion.
  # It no longer doubles as the pub.dev check — that is `tool/caret_check.dart`,
  # which asks the question directly instead of inferring it from a failed
  # `pub get`.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Separate jobs so a red one names which image failed without reading
        # a log. Disk was the other reason expected for the split and turned
        # out not to be one: the first run measured 84 GB free of 145 GB on the
        # runner, and the web build — the heavier of the two, Flutter base
        # image included — moved it by under a gigabyte. The `df` steps below
        # stay because that number belongs to the runner image, not to us, and
        # a guess about it is what put this comment here in the first place.
        include:
          - image: server
            package: imagecheck_server
          - image: web
            package: imagecheck_flutter
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Install the CLI from this commit
        run: dart pub global activate --source path packages/dartway_cli

      - name: Create a project the way a stranger does
        # `--local-repo` points the skeleton at this commit rather than at the
        # `stable` branch the CLI clones by default: the whole question is
        # whether *this* tree still produces a project that builds.
        run: |
          mkdir -p "$RUNNER_TEMP/create"
          cd "$RUNNER_TEMP/create"
          dartway create imagecheck --local-repo "$GITHUB_WORKSPACE" --no-git

      - name: Build the project against this commit, not against pub.dev
        # The created project asks for the versions this tree declares, and
        # between a bump and its release those do not exist on pub.dev. The
        # packages travel into the project so the image is built from the code
        # under test — which is what this job is for.
        run: |
          cd "$GITHUB_WORKSPACE"
          dart run tool/vendor_framework.dart \
            "$RUNNER_TEMP/create/imagecheck" "$GITHUB_WORKSPACE"

      # Kept as instrumentation, not ceremony: see the note on the matrix.
      - name: Disk before the build
        run: df -h /

      - name: Build the ${{ matrix.image }} image
        # Both Dockerfiles build from the project root — the web one needs two
        # packages, and a context can only be one directory. DW_BACKEND_URL is
        # compiled into the web build and the Dockerfile refuses an empty one;
        # what it points at is irrelevant to whether the image builds.
        run: |
          cd "$RUNNER_TEMP/create/imagecheck"
          docker build \
            --file "${{ matrix.package }}/Dockerfile" \
            --build-arg DW_BACKEND_URL=https://images.invalid \
            --tag "dartway-imagecheck-${{ matrix.image }}" \
            .

      - name: Disk after the build
        if: always()
        run: df -h /
