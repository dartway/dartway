name: Checks

# Analyze every package and run every suite: those that need no services, and
# those that need a Postgres and an S3-compatible storage.
#
# It exists because neither was run anywhere. Twenty-one suites, a thousand
# tests, and the five workflows beside this one read a diff, forward a verdict,
# build two web targets, run the project suites and build the deploy images —
# none of them analyzes or runs the framework's own suites, so a change to one
# package could break a suite in another and reach master green. That is not
# hypothetical: #165 made
# `DwAuthConfig.normalizeIdentifier` required, updated the two application call
# sites, and missed a third in a test that builds its own config. The author ran
# what they touched; the suite that broke belonged to a package they had no
# reason to open. It sat on master for a day.
#
# The automated review cannot close this gap either — it reads the diff, and
# that call site was not in it, so it passed the pull request correctly.
#
# Every job runs `tool/checks.sh`, which is also what you run locally. One set of
# checks rather than two, so "I ran the tests" and "CI ran the tests" stop being
# different claims.
#
# The `services` job used to be missing, and its suites — the ORM, the server,
# push: every lock, every transaction, every upload — were run by nobody but a
# person with the containers up. It brings the same two containers
# `tool/checks.sh` documents, on the same ports, and the mode refuses to start
# without them rather than skipping.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [master]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Separate jobs so a red one says which half failed without reading a
        # log, and so the faster of the two answers first.
        mode: [analyze, test]
    name: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      # Only the `test` mode reaches `js_checks` in tool/checks.sh (the `js/*`
      # npm packages, currently js/studio-bridge) — Node stays out of the
      # `analyze` job, which never needs it.
      - if: matrix.mode == 'test'
        uses: actions/setup-node@v4
        with:
          node-version: '22.6'

      - run: tool/checks.sh ${{ matrix.mode }}

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: services
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dartway
          POSTGRES_PASSWORD: dartway
        ports:
          - 55460:5432
        options: >-
          --health-cmd "pg_isready -U dartway"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DW_DATABASE_HOST: 127.0.0.1
      DW_DATABASE_PORT: '55460'
      DW_DATABASE_NAME: postgres
      DW_DATABASE_USER: dartway
      DW_DATABASE_PASSWORD: dartway
      DW_DATABASE_SSL: 'false'
      DW_STORAGE_ENDPOINT: http://127.0.0.1:55470
      DW_STORAGE_ACCESS_KEY: dartway
      DW_STORAGE_SECRET_KEY: dartway-secret
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Start the storage
        # Not a service container: those cannot pass the image its data-path
        # argument. The image is the one `dartway deploy` runs.
        run: |
          docker run -d --name storage -p 127.0.0.1:55470:9000 \
            -e RUSTFS_ACCESS_KEY=dartway -e RUSTFS_SECRET_KEY=dartway-secret \
            rustfs/rustfs:1.0.0 /data
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:55470/health >/dev/null && exit 0
            sleep 1
          done
          docker logs storage
          exit 1

      - run: tool/checks.sh services
