name: Checks

# Analyze every package and run every suite: those that need no services, and
# those that need a Postgres and an S3-compatible storage.
#
# It exists because neither was run anywhere. Twenty-one suites, a thousand
# tests, and the five workflows beside this one read a diff, forward a verdict,
# build two web targets, run the project suites and build the deploy images —
# none of them analyzes or runs the framework's own suites, so a change to one
# package could break a suite in another and reach master green. That is not
# hypothetical: #165 made
# `DwAuthConfig.normalizeIdentifier` required, updated the two application call
# sites, and missed a third in a test that builds its own config. The author ran
# what they touched; the suite that broke belonged to a package they had no
# reason to open. It sat on master for a day.
#
# The automated review cannot close this gap either — it reads the diff, and
# that call site was not in it, so it passed the pull request correctly.
#
# Every job runs `tool/checks.sh`, which is also what you run locally. One set of
# checks rather than two, so "I ran the tests" and "CI ran the tests" stop being
# different claims.
#
# The `services` job used to be missing, and its suites — the ORM, the server,
# push: every lock, every transaction, every upload — were run by nobody but a
# person with the containers up. It brings the same two containers
# `tool/checks.sh` documents, on the same ports, and the mode refuses to start
# without them rather than skipping.
#
# A pull request runs the checks it can break, not all of them: the jobs ask
# `tool/affected.dart`, which reads the change against the pubspec dependency
# graph and the paths each suite is known to read outside its package, and
# hands the answer to `tool/checks.sh` as DW_CHECKS_ONLY. A change to a
# client package no longer waits for the generator's and the CLI's suites,
# and the few test files that take minutes run on the code they execute,
# not on every change to their package. `analyze` covers every package the
# change's code reaches — each one depending on a changed one, through any
# pubspec section, which is the net for exactly the #165 break above. What
# the script cannot place, and anything that pins or picks the checks, runs
# everything; a push to master always does.
#
# The suites are split into jobs by length: the generator's and the CLI's
# are the two longest and run alone, the rest together, so the wall clock is
# the longest of three instead of their sum. Inside a job, `tool/checks.sh`
# runs its checks side by side, and the generator's and the CLI's `dart test`
# runs as several processes (DW_TEST_SHARDS), each with a share of every
# file's tests: one file holds most of the generator's time.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The pull request's base; empty on a push, which runs everything.
  DW_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DW_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pick the roots
        id: affected
        run: |
          flutter pub get >/dev/null
          only="$(dart run tool/affected.dart --base "$DW_AFFECTED_BASE" --shard analyze)"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "${only:-nothing is affected}"

      - run: tool/checks.sh analyze
        env:
          DW_CHECKS_ONLY: ${{ steps.affected.outputs.only }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [generator, cli, rest]
        include:
          - shard: generator
            processes: 4
          - shard: cli
            processes: 2
    name: test (${{ matrix.shard }})
    env:
      DW_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # Only the `rest` shard holds the `js/*` npm packages (currently
      # js/studio-bridge), the one place `tool/checks.sh test` needs Node.
      # 22.18.0, not the 22.6 the package.json floor used to say: below
      # 22.18.0 Node's `.ts` type stripping is not on by default, `node
      # --test`'s file discovery matches nothing, and it prints `# tests 0`
      # and exits 0 — a run that skipped every test looked exactly like one
      # that passed them (caught in review of the PR that added this job,
      # 36243686357).
      - if: matrix.shard == 'rest'
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Pick the suites
        id: affected
        run: |
          flutter pub get >/dev/null
          only="$(dart run tool/affected.dart --base "$DW_AFFECTED_BASE" --shard ${{ matrix.shard }})"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "${only:-nothing in this shard is affected}"

      # The `rest` shard also runs the suites named in BROWSER in Chrome
      # (`browser_suites`, D-136). No setup step: the ubuntu-latest image puts
      # `google-chrome` on PATH, and `require_chrome` stops the job by name if
      # an image ever comes without it.
      - run: tool/checks.sh test
        env:
          DW_CHECKS_ONLY: ${{ steps.affected.outputs.only }}
          DW_TEST_SHARDS: ${{ matrix.processes || 1 }}

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: services
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dartway
          POSTGRES_PASSWORD: dartway
        ports:
          - 55460:5432
        options: >-
          --health-cmd "pg_isready -U dartway"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DW_DATABASE_HOST: 127.0.0.1
      DW_DATABASE_PORT: '55460'
      DW_DATABASE_NAME: postgres
      DW_DATABASE_USER: dartway
      DW_DATABASE_PASSWORD: dartway
      DW_DATABASE_SSL: 'false'
      DW_STORAGE_ENDPOINT: http://127.0.0.1:55470
      DW_STORAGE_ACCESS_KEY: dartway
      DW_STORAGE_SECRET_KEY: dartway-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Pick the suites
        id: affected
        run: |
          flutter pub get >/dev/null
          only="$(dart run tool/affected.dart --base "$DW_AFFECTED_BASE" --shard services)"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "${only:-nothing is affected}"

      - name: Start the storage
        # Not a service container: those cannot pass the image its data-path
        # argument. The image is the one `dartway deploy` runs.
        run: |
          docker run -d --name storage -p 127.0.0.1:55470:9000 \
            -e RUSTFS_ACCESS_KEY=dartway -e RUSTFS_SECRET_KEY=dartway-secret \
            rustfs/rustfs:1.0.0 /data
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:55470/health >/dev/null && exit 0
            sleep 1
          done
          docker logs storage
          exit 1

      - run: tool/checks.sh services
        env:
          DW_CHECKS_ONLY: ${{ steps.affected.outputs.only }}
