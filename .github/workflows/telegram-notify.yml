name: Telegram Notifications

# One signal, because only one earns an alert: the verdict of the automated
# review. You open the pull request yourself and then move on; minutes later
# this says whether it came back clean. That is new information and it asks
# for a decision.
#
# Deliberately absent: an alert when a pull request opens (an alert about your
# own action is noise, and the review's verdict covers pull requests from
# other people too) and an alert on promotion to `stable` (that one is for the
# team, not for the maintainer, and belongs with the rest of the team-facing
# notifications whenever those get built).

on:
  workflow_run:
    workflows: ["Claude PR Review"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-finished:
    runs-on: ubuntu-latest
    steps:
      - name: Send the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_STARTED: ${{ github.event.workflow_run.created_at }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No pull request for $HEAD_SHA — nothing to report."
            exit 0
          fi

          title=$(gh pr view "$pr" --repo "$REPO" --json title --jq .title)
          url=$(gh pr view "$pr" --repo "$REPO" --json url --jq .url)

          if [ "$RUN_CONCLUSION" != "success" ]; then
            text="Review did not finish — PR #$pr: $title
          Conclusion: $RUN_CONCLUSION
          $RUN_URL"
          else
            # The review publishes its summary as a comment. Take the newest bot
            # comment created after this run started, so a silent run cannot pick
            # up the previous run's verdict and report it as fresh.
            # Truncation happens in jq, which slices by codepoint. Cutting the
            # text in the shell instead (`head -c`) counts bytes, splits a
            # multi-byte character in half, and Telegram answers 400 to the
            # malformed UTF-8 that results.
            summary=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
              --jq "[.[] | select(.user.type == \"Bot\") | select(.created_at >= \"$RUN_STARTED\")] | last | (.body // \"\")[0:2000]")
            [ -n "$summary" ] || summary="(the review left no summary comment — see the run log)"
            text="Review finished — PR #$pr: $title

          $summary

          $url"
          fi

          # Keep the response: on a rejection Telegram explains itself in the
          # body, and discarding it into /dev/null once cost a debugging round.
          if ! response=$(curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true"); then
            echo "Telegram rejected the message: $response"
            exit 1
          fi
