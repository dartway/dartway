name: Web compile

# dart2js rejects things the VM accepts — an integer literal that a JavaScript
# double cannot hold exactly is the standing example. Unit tests run on the VM
# and cannot see that class of error at all, so the only guard is compiling for
# the web. `dartway_offline_flutter` reached a consumer's release build with two
# such literals in it precisely because nothing here ever compiled it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [master]

concurrency:
  group: web-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The offline package is depended on by no example and no template,
          # so it carries its own harness — see the app's `lib/main.dart`.
          - name: dartway_offline_flutter
            path: packages/dartway_offline/dartway_offline_flutter/example
          # The example covers the core, dartway_flutter and the router.
          - name: example
            path: example/dartway_example_flutter
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      # The workspace resolves from the repository root; the two web targets
      # sit outside it and resolve on their own.
      - run: flutter pub get
      - run: flutter pub get
        working-directory: ${{ matrix.path }}

      - run: flutter build web --release
        working-directory: ${{ matrix.path }}
