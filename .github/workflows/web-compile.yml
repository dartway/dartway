name: Web compile

# dart2js rejects things the VM accepts — an integer literal that a JavaScript
# double cannot hold exactly is the standing example. Unit tests run on the VM
# and cannot see that class of error at all, so the only guard is compiling for
# the web. A package that nothing here ever compiled reached a consumer's
# release build with two such literals in it; that is what this job prevents.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [master]

concurrency:
  group: web-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      # The example covers the core, dartway_core_flutter and the router. The
      # workspace resolves from the repository root; the example sits outside it
      # and resolves on its own.
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example/dartway_example_flutter

      - run: flutter build web --release
        working-directory: example/dartway_example_flutter

  floor:
    # The floor the framework promises (`flutter: '>=3.44.0'`, D-081, D-082):
    # the skeleton compiled on the oldest Flutter it claims. Everything else in
    # CI runs on the pin, so without this job the floor is a sentence nobody
    # checks. Resolved without the committed lock, which the pin wrote.
    name: template on the floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - run: rm pubspec.lock && flutter pub get
        working-directory: template/dartway_starter_flutter

      - run: flutter build web --release
        working-directory: template/dartway_starter_flutter
