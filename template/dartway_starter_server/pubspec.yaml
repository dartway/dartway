name: dartway_starter_server
description: The server of the app, on DartWay.
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  dartway_core_server: ^0.21.0-dev.13
  # Events from the app in this project's Postgres, and the reports and
  # dashboards the admin panel reads from them.
  dartway_analytics_server: ^0.2.0
  # The contract with the app. A path dependency, so the server image copies
  # this directory too — an image that does not is unbuildable, and pub says
  # so three layers from the cause.
  dartway_starter_shared:
    path: ../dartway_starter_shared

dev_dependencies:
  # `dartway generate` runs the generator this package resolves, so it always
  # matches the framework the project builds against.
  dartway_generator: ^0.21.0-dev.13
  lints: ^6.0.0
  test: ^1.26.0

# Inside the monorepo the template builds against the LOCAL framework packages.
# `dartway create` removes this whole block when it copies the template.
dependency_overrides:
  dartway_analytics_server:
    path: ../../packages/dartway_analytics_server
  dartway_analytics_shared:
    path: ../../packages/dartway_analytics_shared
  dartway_client:
    path: ../../packages/dartway_client
  dartway_core_server:
    path: ../../packages/dartway_core_server
  dartway_core_shared:
    path: ../../packages/dartway_core_shared
  dartway_generator:
    path: ../../packages/dartway_generator
  dartway_orm:
    path: ../../packages/dartway_orm
