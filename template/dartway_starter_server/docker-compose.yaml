services:
  # Development database. Matches config/development.yaml (localhost:8090,
  # database "dartway_starter", user "postgres"). Redis is disabled in the
  # development config, so only Postgres is started here.
  postgres:
    image: postgres:16
    ports:
      - '8090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dartway_starter
      POSTGRES_PASSWORD: 'dartway_dev_pw'
    volumes:
      - dartway_starter_data:/var/lib/postgresql/data

  # Test database. Matches config/test.yaml (localhost:9090, database
  # "dartway_starter_test"). Kept separate from development on purpose: the
  # integration tests commit real transactions (concurrency cannot be observed
  # inside a rolled-back one) and truncate tables between cases.
  postgres_test:
    image: postgres:16
    ports:
      - '9090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dartway_starter_test
      POSTGRES_PASSWORD: 'dartway_test_pw'
    # No volume: a test database that survives a restart is a liability.

  # Object storage for uploads. DartWay's cloud storage speaks S3 through the
  # minio client, so a local Minio is the same code path production runs — not a
  # development stand-in that behaves differently once you deploy.
  # Matches the dwCloudStorage* keys in config/passwords.yaml.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9101"
    ports:
      - '9100:9000' # S3 API — what the server and the app talk to
      - '9101:9101' # web console, handy for looking at what was uploaded
    environment:
      MINIO_ROOT_USER: dartway_dev
      MINIO_ROOT_PASSWORD: 'dartway_dev_storage_pw'
    volumes:
      - dartway_starter_uploads:/data

  # Creates the bucket on first start and opens it for reading, because the
  # public URLs the server hands out have to resolve in a browser and an
  # <Image.network>. Runs to completion and exits; it is not a service.
  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dartway_dev dartway_dev_storage_pw; do sleep 1; done;
      mc mb --ignore-existing local/uploads;
      mc anonymous set download local/uploads;
      "

volumes:
  dartway_starter_data:
  dartway_starter_uploads:
