services:
  # Development database. The `DW_DATABASE_*` values in ../README.md point at it
  # (127.0.0.1:8090, database "dartway_starter", user "postgres").
  #
  # No test database here, on purpose: `dartway test` starts one for the run on
  # a port Docker picks, and each test file creates and drops its own database
  # on it.
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:8090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dartway_starter
      POSTGRES_PASSWORD: 'dartway_dev_pw'
    volumes:
      - dartway_starter_data:/var/lib/postgresql/data

  # Object storage for uploads: the app uploads straight to it by a presigned
  # URL the server issues, so a local MinIO is the same path production runs.
  # The `DW_STORAGE_*` values in ../README.md point at it.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":8101"
    ports:
      - '127.0.0.1:8100:9000' # S3 API — what the server and the app talk to
      - '127.0.0.1:8101:8101' # web console, handy for looking at uploads
    environment:
      MINIO_ROOT_USER: dartway_dev
      MINIO_ROOT_PASSWORD: 'dartway_dev_storage_pw'
    volumes:
      - dartway_starter_uploads:/data

volumes:
  dartway_starter_data:
  dartway_starter_uploads:
