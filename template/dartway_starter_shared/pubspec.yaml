name: dartway_starter_shared
description: The contract between the server and the app — data objects, requests, commands, channels, refusal codes and the rules both sides apply identically.
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

# Pure Dart, and nothing but the framework's shared half: whatever this package
# declares is compiled into the server and into the app alike, so it cannot
# reach for Flutter, a database or IO.
dependencies:
  dartway_core_shared: ^0.20.0-dev.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# Inside the monorepo the template builds against the LOCAL framework packages.
# `dartway create` removes this whole block when it copies the template.
dependency_overrides:
  dartway_core_shared:
    path: ../../packages/dartway_core_shared
