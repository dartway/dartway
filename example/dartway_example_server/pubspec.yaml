name: dartway_example_server
description: The DartWay example — a fitness club server.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  dartway_core_server: ^0.20.0-dev.1
  dartway_push_server: ^0.3.0-dev.1
  dartway_example_shared:
    path: ../dartway_example_shared

dev_dependencies:
  dartway_generator: ^0.20.0-dev.1
  lints: ^6.0.0
  test: ^1.26.0

# The example builds against this tree of the framework.
dependency_overrides:
  dartway_client:
    path: ../../packages/dartway_client
  dartway_core_server:
    path: ../../packages/dartway_core_server
  dartway_core_shared:
    path: ../../packages/dartway_core_shared
  dartway_generator:
    path: ../../packages/dartway_generator
  dartway_orm:
    path: ../../packages/dartway_orm
  dartway_push_server:
    path: ../../packages/dartway_push_server
  dartway_push_shared:
    path: ../../packages/dartway_push_shared
