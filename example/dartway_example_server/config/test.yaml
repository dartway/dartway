# This is the configuration file for your test environment.
# All ports are set to zero in this file which makes the server find the next available port.
# This is needed to enable running tests concurrently. To set up your server, you will
# need to add the name of the database you are connecting to and the user name.
# The password for the database is stored in the config/passwords.yaml.
#
# When running your server locally, the server ports are the same as the public
# facing ports.

# Configuration for the main API test server.
apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# Configuration for the Insights test server.
insightsServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# Configuration for the web test server.
webServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# This is the database setup for your test server.
#
# `dartway test` supplies host and port through SERVERPOD_DATABASE_*: it starts a
# database for the run, on a port Docker picks, and removes it at the end. Name
# and user are read from here, so that container carries the names this project
# expects.
#
# The port is 0 on purpose, and it is not the same 0 as the servers above — they
# ask the OS for a free port to listen on, while nothing can be *reached* at
# port 0. That is the point: a suite run by hand connects nowhere instead of
# reaching whatever else happens to be listening. It used to name a fixed port,
# and on a machine with two DartWay projects that meant reading the other
# project's database — green, having verified nothing.
#
# Be warned about how that failure looks: `withServerpod` suppresses the test
# server's startup output, so a run that cannot reach its database exits 1 with
# nothing but "loading <file>" printed. No message names the database. If you
# see that, you ran `dart test`; run `dartway test`.
database:
  host: localhost
  port: 0
  name: dartway_example_test
  user: postgres

# This is the setup for your Redis test instance.
redis:
  enabled: false
  host: localhost
  port: 9091
  #user: # defaults to empty
  #requireSsl: true # defaults to false

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000
