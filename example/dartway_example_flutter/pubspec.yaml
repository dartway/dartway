name: dartway_example_flutter
description: The DartWay example — a fitness club app on DartWay 1.0.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The contract with the server: every request, command, data object and
  # refusal code the app speaks.
  dartway_example_shared:
    path: ../dartway_example_shared

  # The DartWay app skeleton: the client, its Riverpod bindings, the router
  # and the shared contract, re-exported — one framework import.
  dartway_core_flutter: ^0.20.0-dev.1
  # Where the signed-in session is kept: the core asks the plugins for whoever
  # claimed the DwKeyValueStorePlugin role, and without one there is nowhere
  # to put the session.
  dartway_shared_preferences: ^0.5.0

  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.0.0

  # UI-kit dependencies: the kit lives in this app's `lib/ui_kit/`, so its
  # packages belong to the app, not to the framework.
  device_frame: ^1.4.0
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  pin_code_fields: ^8.0.1
  collection: ^1.19.1

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

  # `DwFakeServer`: widget tests talk to an in-memory server that speaks the
  # real HTTP contract and live socket.
  dartway_client: ^0.20.0-dev.1

  dartway_cli: ^0.10.0

  # The UI-kit law is enforced here, not just written down: raw Color/TextStyle/
  # BorderRadius and direct theme access outside `ui_kit/` are lints. Needs
  # `analyzer: plugins: [custom_lint]` in analysis_options.yaml, and runs in the
  # IDE and via `dart run custom_lint`.
  custom_lint: ^0.8.0
  dartway_lints: ^0.3.0

# Inside the monorepo the example builds against the LOCAL framework packages.
# Copied out into a standalone project — drop the whole dependency_overrides block.
dependency_overrides:
  dartway_cli:
    path: ../../packages/dartway_cli
  dartway_client:
    path: ../../packages/dartway_client
  dartway_core_flutter:
    path: ../../packages/dartway_core_flutter
  dartway_core_shared:
    path: ../../packages/dartway_core_shared
  dartway_lints:
    path: ../../packages/dartway_lints
  dartway_router:
    path: ../../packages/dartway_router
  dartway_shared_preferences:
    path: ../../packages/dartway_shared_preferences

flutter_native_splash:
  color: "#05060C"
  image: assets/dartway_splash_logo.png

  android: true
  ios: true
  web: true

  android_12:
    image: assets/dartway_splash_logo.png
    icon_background_color: "#05060C"

flutter:
  generate: true # gen-l10n (see l10n.yaml); output is checked in under lib/l10n/gen

  uses-material-design: true

  assets:
    - assets/
