name: dartway_example_shared
description: The contract between the example server and app — data objects, requests, commands, channels, refusal codes.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  dartway_core_shared: ^0.21.0-dev.1
  # Push categories and the token registration calls the app and server share.
  dartway_push_shared: ^0.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# The example lives in the framework repository and builds against this tree.
dependency_overrides:
  dartway_core_shared:
    path: ../../packages/dartway_core_shared
  dartway_push_shared:
    path: ../../packages/dartway_push_shared
