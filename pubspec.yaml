name: dartway_framework
environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

workspace:
  - packages/dartway_cli
  - packages/dartway_client
  - packages/dartway_core
  - packages/dartway_flutter
  - packages/dartway_lints
  - packages/dartway_orm
  - packages/dartway_router
  - packages/dartway_server
  - packages/dartway_shared_preferences
  - packages/dartway_studio_bridge
  - packages/dartway_telegram

# `packages/dartway_generator` is deliberately NOT a workspace member: it pins
# `analyzer` at the version it is written against, and `dartway_lints` (through
# custom_lint) pins an older one. A tool resolves on its own.

# `packages/dartway_lints/example` is deliberately NOT a workspace member: a
# member has no `.dart_tool/package_config.json` of its own (the workspace root
# holds the only one), and that is exactly where custom_lint looks for its
# plugins — inside the workspace it loads none and reports "No issues found" on
# a file full of violations. It resolves standalone instead.
