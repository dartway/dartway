name: dartway_framework
environment:
  sdk: ^3.11.0
  flutter: ^3.44.0

workspace:
  - packages/dartway_analytics_flutter
  - packages/dartway_analytics_server
  - packages/dartway_analytics_shared
  - packages/dartway_auth_apple
  - packages/dartway_auth_google
  - packages/dartway_auth_providers_server
  - packages/dartway_auth_providers_shared
  - packages/dartway_cli
  - packages/dartway_client
  - packages/dartway_core_flutter
  - packages/dartway_core_server
  - packages/dartway_core_shared
  - packages/dartway_orm
  - packages/dartway_push_firebase
  - packages/dartway_push_flutter
  - packages/dartway_push_rustore
  - packages/dartway_push_server
  - packages/dartway_push_shared
  - packages/dartway_router
  - packages/dartway_shared_preferences
  - packages/dartway_studio_bridge
  - packages/dartway_studio_binding
  - packages/dartway_telegram
  - tool

# `packages/dartway_generator` and `packages/dartway_lints` are deliberately NOT
# workspace members: each pins the `analyzer` it is written against, and the
# workspace cannot hold it — `flutter_test` pins a `test` that caps the analyzer
# below 14. A tool resolves on its own.

# `packages/dartway_lints/example` resolves standalone too: it is the fixture
# the plugin is proved on, enabling it by path the way a project enables it by
# version.
