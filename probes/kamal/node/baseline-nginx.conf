server {
  listen 80;
  server_name node.probe.stageserver.ru web.probe.stageserver.ru;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name node.probe.stageserver.ru web.probe.stageserver.ru;
  ssl_certificate /etc/letsencrypt/live/api.probe.stageserver.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.probe.stageserver.ru/privkey.pem;
  resolver 127.0.0.11 valid=5s;
  location / {
    set $node_backend probe-node:3000;
    proxy_pass http://$node_backend;
  }
}
