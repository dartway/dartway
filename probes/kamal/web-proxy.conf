# Add inside the generated project's existing nginx server block.
# A separate web service forwards the app's same-origin calls to the API.
location /dw/ {
  proxy_pass https://api.probe.stageserver.ru;
  proxy_ssl_server_name on;
  proxy_set_header Host api.probe.stageserver.ru;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 1h;
  proxy_buffering off;
}
location = /health {
  proxy_pass https://api.probe.stageserver.ru;
  proxy_ssl_server_name on;
  proxy_set_header Host api.probe.stageserver.ru;
}
