service: probe-node
image: probe-node
servers:
  web:
    hosts: [82.26.151.195]
proxy:
  hosts: [node.probe.stageserver.ru, web.probe.stageserver.ru]
  ssl: true
  app_port: 3000
  healthcheck:
    path: /health
  run:
    version: v0.10.2
registry:
  server: registry.probe.stageserver.ru
  username: probe
  password: [PROBE_REGISTRY_PASSWORD]
ssh:
  user: root
  keys: [~/.ssh/id_ed25519_global]
  keys_only: true
builder:
  arch: amd64
  dockerfile: probes/kamal/node/Dockerfile
  context: probes/kamal/node
env:
  secret: [POSTGRES_PASSWORD]
accessories:
  postgres:
    image: postgres:17-alpine
    host: 82.26.151.195
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_DB: probe_node
        POSTGRES_USER: probe_node
      secret: [POSTGRES_PASSWORD]
    directories: [postgres:/var/lib/postgresql/data]
retain_containers: 5
output:
  otel:
    endpoint: http://127.0.0.1:4318
