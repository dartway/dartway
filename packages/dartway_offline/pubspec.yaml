name: dartway_offline
description: "Optional user-scoped offline lifecycle support for DartWay Flutter apps."
version: 0.1.0
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, flutter, offline, storage]

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  dartway_flutter: ^0.5.0
  dartway_serverpod_core_flutter: ^0.9.0
  drift: 2.31.0
  drift_flutter: 0.2.8
  background_downloader: ^9.5.7
  connectivity_plus: ^7.3.1
  disk_space_plus: ^0.2.6
  crypto: ^3.0.7
  cryptography: ^2.9.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  dartway_offline_server: ^0.1.0
  drift_dev: 2.31.0
