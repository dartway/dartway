name: dartway_offline_flutter_example
description: The web-compilation harness for dartway_offline_flutter — nothing here is meant to be run.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  dartway_offline_flutter:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# The harness builds against the LOCAL framework packages, the same way
# `example/` at the root of the monorepo does.
dependency_overrides:
  dartway_offline_flutter:
    path: ../
  dartway_offline_shared:
    path: ../../dartway_offline_shared
  dartway_flutter:
    path: ../../../dartway_flutter
  dartway_serverpod_core_flutter:
    path: ../../../dartway_serverpod_core/dartway_serverpod_core_flutter
  dartway_serverpod_core_client:
    path: ../../../dartway_serverpod_core/dartway_serverpod_core_client
  dartway_serverpod_core_shared:
    path: ../../../dartway_serverpod_core/dartway_serverpod_core_shared
