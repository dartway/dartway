# generated by `dartway deploy kamal` — change deploy/config.yaml and regenerate
service: "shop-storage"
image: "acme/shop-storage"
minimum_version: "2.12.0"
proxy:
  ssl: true
  run:
    version: "v0.10.2"
    options:
      sysctl: "net.ipv4.tcp_congestion_control=bbr"
  app_port: 9000
  healthcheck:
    path: "/health"
  buffering:
    requests: false
    responses: false
registry:
  server: "ghcr.io"
  username: "acme"
  password: ["KAMAL_REGISTRY_PASSWORD"]
builder:
  arch: "amd64"
  dockerfile: "deploy/kamal/storage/Dockerfile"
  context: "deploy/kamal/storage"
deploy_timeout: 30
drain_timeout: 30
retain_containers: 5
