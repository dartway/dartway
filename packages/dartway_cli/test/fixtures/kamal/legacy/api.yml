# generated by `dartway deploy kamal` — change deploy/config.yaml and regenerate
service: "shop-api"
image: "acme/shop-api"
minimum_version: "2.12.0"
proxy:
  ssl: true
  forward_headers: true
  run:
    version: "v0.10.2"
    options:
      sysctl: "net.ipv4.tcp_congestion_control=bbr"
  app_port: 8080
  healthcheck:
    path: "/health"
  buffering:
    requests: false
    responses: false
registry:
  server: "ghcr.io"
  username: "acme"
  password: ["KAMAL_REGISTRY_PASSWORD"]
builder:
  arch: "amd64"
  dockerfile: "shop_server/Dockerfile"
  context: "."
deploy_timeout: 30
drain_timeout: 30
retain_containers: 5
hooks_path: "deploy/kamal/hooks/api"
