# generated by `dartway deploy kamal` — change deploy/config.yaml and regenerate
project: "probe"
services: ["storage","api","web"]
environment:
  name: "STUDIO_ENVIRONMENT"
  host: "STUDIO_HOST"
  ssh_user: "STUDIO_SSH_USER"
kamal:
  version: "2.12.0"
  config: "deploy/kamal/{service}.yml"
  destination: "{env}"
  destination_config:
    path: "deploy/kamal/{service}.{env}.yml"
    content: "{}"
ingress:
  api:
    variable: "STUDIO_DOMAIN_API"
    service: "api"
  app:
    variable: "STUDIO_DOMAIN_APP"
    service: "web"
  files:
    variable: "STUDIO_DOMAIN_FILES"
    service: "storage"
    component: "storage"
components:
  database:
    variable: "STUDIO_BUNDLED_DATABASE"
    provider:
      service: "api"
      accessory: "postgres"
    bundled: {}
    external:
      secrets: ["DW_DATABASE_HOST","DW_DATABASE_PORT","DW_DATABASE_NAME","DW_DATABASE_USER"]
  storage:
    variable: "STUDIO_BUNDLED_STORAGE"
    provider:
      service: "storage"
    bundled:
      secrets: ["DW_STORAGE_ACCESS_KEY","DW_STORAGE_SECRET_KEY"]
    external:
      values: ["DW_STORAGE_ENDPOINT"]
      optional_values: ["DW_STORAGE_PUBLIC_BUCKET","DW_STORAGE_PUBLIC_BASE_URL","DW_STORAGE_PRIVATE_BUCKET","DW_STORAGE_REGION","DW_STORAGE_PATH_STYLE"]
      secrets: ["DW_STORAGE_ACCESS_KEY","DW_STORAGE_SECRET_KEY"]
values: ["DW_TRUSTED_PROXY_NETWORKS"]
secrets: ["KAMAL_REGISTRY_PASSWORD","DW_DATABASE_PASSWORD"]
secrets_import: "~/.kamal/apps/probe-api-{env}/env/roles/web.env"
health: "/health"
migrations: ["probe_server/lib/src/migrations/**","probe_server/pubspec.lock"]
check:
  image: "ghcr.io/dartway/dartway-check:0.24.0"
  args: ["--project","/project","--env","{env}","--version","{version}"]
  environment: ["STUDIO_DOMAIN_API","STUDIO_DOMAIN_APP","STUDIO_DOMAIN_FILES","STUDIO_BUNDLED_STORAGE"]
