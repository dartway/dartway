name: dartway_analytics_flutter
description: "Analytics for a DartWay app, reached as dw.plugins.analytics: events tracked by name, kept on the device until sent, and sent in batches to the project's own server."
version: 0.1.0-dev.1
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, analytics, flutter]
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  dartway_analytics_shared: ^0.1.0-dev.1
  dartway_core_flutter: ^0.20.0-dev.1
  shared_preferences: ^2.3.0

dev_dependencies:
  # `DwFakeServer`: the plugin sends through a real client against it.
  dartway_client: ^0.20.0-dev.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
