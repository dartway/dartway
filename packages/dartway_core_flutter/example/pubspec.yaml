name: dartway_core_flutter_example
description: A runnable tour of dartway_core_flutter — copy, flutter run, read top to bottom.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  dartway_core_flutter:
    path: ../
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Inside the monorepo the tour builds against the LOCAL framework packages —
# the same reason example/dartway_example_flutter and template/*/pubspec.yaml
# carry a dependency_overrides block for the same three packages. Here it
# lives in the sibling pubspec_overrides.yaml instead of in this file: pub
# reads it the same way (merged in as if it were this file's own
# dependency_overrides:), but it is excluded from the published archive
# (../.pubignore), so `dart pub publish`'s own tour — the "copy, flutter run"
# this package's description promises — resolves the three from pub.dev with
# nothing to delete first.
