name: dartway_core_flutter_example
description: A runnable tour of dartway_core_flutter — copy, flutter run, read top to bottom.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  dartway_core_flutter:
    path: ../
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Inside the monorepo the tour builds against the LOCAL framework packages —
# the same reason example/dartway_example_flutter and template/*/pubspec.yaml
# carry this block. Copied out of the monorepo (the "copy, flutter run" this
# package's description promises): drop this whole dependency_overrides
# block; dartway_core_flutter's own pubspec states hosted carets on all three,
# and they resolve from pub.dev once published.
dependency_overrides:
  dartway_client:
    path: ../../dartway_client
  dartway_core_shared:
    path: ../../dartway_core_shared
  dartway_router:
    path: ../../dartway_router
