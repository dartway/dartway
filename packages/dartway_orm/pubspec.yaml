name: dartway_orm
description: Typed PostgreSQL access, schema and migrations for DartWay servers.
version: 0.21.0-dev.6
repository: https://github.com/dartway/dartway
license: Apache-2.0
resolution: workspace
environment:
  sdk: ^3.11.0
dependencies:
  collection: ^1.19.0
  crypto: ^3.0.6
  # Formats migration drafts. ^3.1.3 spans the analyzer of the workspace
  # (flutter_test's `test` caps it below 14) and of a server project, which
  # resolves the generator's analyzer 14.
  dart_style: ^3.1.3
  dartway_core_shared: ^0.21.0-dev.5
  meta: ^1.16.0
  path: ^1.9.0
  postgres: ^3.5.12
  pub_semver: ^2.1.4
  stream_channel: ^2.1.4
  yaml: ^3.1.2
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
