name: dartway_auth_google
description: "Sign in with Google for a DartWay app: the SDK initialised with a nonce the server checks, and the ID token made into the sign-in command the app sends and, after a refused sign-up, sends again."
version: 0.2.0
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, auth, google, sign-in, flutter]

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  dartway_auth_providers_shared: ^0.1.1
  google_sign_in: ^7.2.0

dev_dependencies:
  # `DwFakeServer`: the command is sent through a real client against it.
  dartway_client: ^0.21.0-dev.17
  dartway_core_flutter: ^0.21.0-dev.17
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
