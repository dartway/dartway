group = 'dev.dartway.push.rustore'
version = '0.5.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// The RuStore SDK is not on Maven Central. Declared here so an app that adds
// this plugin resolves it without editing its own Gradle files — the same
// arrangement flutter_rustore_push uses.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://nexus-external.rustore.ru/repository/maven-rustore-exposed' }
    }
}

// RuStore retires its old repository on 01.10.2026, and flutter_rustore_push
// 7.2.0 — which this plugin depends on — still adds it to every project. A
// repository host that no longer answers fails the build instead of being
// skipped, so it is removed once every project has declared its own.
gradle.projectsEvaluated {
    rootProject.allprojects {
        repositories.removeIf { repository ->
            repository instanceof MavenArtifactRepository &&
                repository.url.host == 'artifactory-external.vkpartner.ru'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.dartway.push.rustore'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        // RuStore push requires 24; the notification permission arrives at 33
        // and is handled at runtime.
        minSdk 24
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'ru.rustore.sdk:pushclient:7.2.0'
    testImplementation 'junit:junit:4.13.2'
}
