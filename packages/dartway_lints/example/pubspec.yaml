name: dartway_lints_example
description: >-
  The fixture dartway_lints is proved on: files that must trigger its rules and
  files that must not, each expected diagnostic marked `// expect_lint: <rule>`
  on the line above. `test/example_test.dart` in the plugin package runs
  `dart analyze` here and compares — the rules' bugs live in how they match
  real Flutter code, which only the analyzer can prove.
publish_to: none
version: 0.1.0

# Not a workspace member: the plugin it enables is enabled by path from
# analysis_options.yaml, and the fixture resolves the Flutter it is written
# against on its own.

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  # For the forbidden_provider_scope fixtures: the rule matches ProviderScope by
  # name, but a fixture that cannot compile proves nothing about real code.
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
