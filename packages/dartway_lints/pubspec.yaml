name: dartway_lints
description: "DartWay's convention rules as an analyzer plugin: the UI kit as the single source of styles, relative imports kept short, and ProviderScope left to the app bootstrap and tests. Shown in the IDE, dart analyze and flutter analyze."
version: 0.4.0
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, lints, linter, flutter]

# Not a workspace member: the plugin pins the analyzer the SDK's plugin API is
# written against (14), and the workspace cannot resolve it — flutter_test pins
# a `test` that caps the analyzer below 14. A plugin is resolved by the analysis
# server on its own anyway, never inside the project it analyzes.

environment:
  sdk: ^3.9.0

dependencies:
  # The plugin API moves with the analyzer, which moves with the SDK: 0.3.23
  # pins analyzer 14.4.0, and loads on Dart 3.12 (Flutter 3.44) and 3.13
  # (Flutter 3.47) alike.
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0

dev_dependencies:
  analyzer_testing: any
  path: ^1.9.0
  test: ^1.25.0
  test_reflective_loader: ^0.2.0
