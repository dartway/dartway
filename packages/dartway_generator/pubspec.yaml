name: dartway_generator
description: Code generation for DartWay projects — DTO codecs, registries, entity tables and schema.
version: 0.20.1-dev.1
repository: https://github.com/dartway/dartway
license: Apache-2.0
environment:
  sdk: ^3.11.0

executables:
  dartway_generator:

dependencies:
  analyzer: ^14.4.0
  args: ^2.7.0
  dart_style: ^3.1.13
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.2
dev_dependencies:
  dartway_core_server:
    path: ../dartway_core_server
  dartway_core_shared:
    path: ../dartway_core_shared
  dartway_orm:
    path: ../dartway_orm
  dartway_push_server:
    path: ../dartway_push_server
  dartway_push_shared:
    path: ../dartway_push_shared
  lints: ^6.0.0
  test: ^1.26.0

# Outside the workspace, the framework packages the generator's tests compile
# generated code against resolve from this tree, not from pub.dev.
dependency_overrides:
  dartway_client:
    path: ../dartway_client
  dartway_core_server:
    path: ../dartway_core_server
  dartway_core_shared:
    path: ../dartway_core_shared
  dartway_orm:
    path: ../dartway_orm
  dartway_push_server:
    path: ../dartway_push_server
  dartway_push_shared:
    path: ../dartway_push_shared
