name: dartway_push_rustore
description: "RuStore push transport for DartWay: tokens, the Android 13 permission prompt, notification rendering for data-only messages and taps, behind the dw.plugins.push contract."
version: 0.1.0
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, push, notifications, rustore, android]

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  dartway_push_flutter: ^0.1.0

  flutter_rustore_push: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.dartway.push.rustore
        pluginClass: DwRuStorePushPlugin
