# This is the configuration file for your test environment.
# All ports are set to zero in this file which makes the server find the next available port.
# This is needed to enable running tests concurrently. To set up your server, you will
# need to add the name of the database you are connecting to and the user name.
# The password for the database is stored in the config/passwords.yaml.
#
# When running your server locally, the server ports are the same as the public
# facing ports.

# Configuration for the main API test server.
apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# Configuration for the Insights test server.
insightsServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# Configuration for the web test server.
webServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

# This is the database setup for your test server.
# No test database is served for this module, and there is no compose file here
# to serve one. The module has no integration suite — every test under `test/`
# is a unit test and needs nothing running — so a declared Postgres would be a
# container nobody starts, on a port shared with whatever else is on the
# machine. The reasoning is the template's, written out in its
# `docker-compose.yaml`: a test database declared as a service is shared, named,
# long-lived and on a fixed port, and every one of those is wrong for it.
#
# The port is therefore 0, as it is in `template/` and `example/`: when an
# integration suite arrives here it will be handed a database and its
# coordinates, the way `dartway test` hands them to a project.
database:
  host: localhost
  port: 0
  name: dartway_push_test
  user: postgres

# This is the setup for your Redis test instance.
redis:
  enabled: false
  host: localhost
  port: 9091
  #user: # defaults to empty
  #requireSsl: true # defaults to false

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
