name: dartway_push_client
description: "Client side of the DartWay push module: the device token registration request, and the generated protocol the server half needs. Thin — it exists because a Serverpod module needs a client package."
version: 0.2.0
repository: https://github.com/dartway/dartway

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  serverpod_client: ^3.4.11

  # The generated protocol imports it: a push message carries DartWay's own
  # wrapper types. Inside the workspace this resolved without being declared,
  # which is exactly the kind of dependency that only fails once the package is
  # published and somebody else resolves it.
  dartway_serverpod_core_client: ^0.12.0