name: dartway_push_flutter
description: "Push notifications for a DartWay app, reached as dw.plugins.push: token lifecycle, permissions and notification taps. Carries no vendor SDK — add dartway_push_firebase or dartway_push_rustore."
version: 0.1.0
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, push, notifications, flutter]

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  dartway_flutter: ^0.7.0
  # The device registration request, and the CRUD action that carries it. The
  # app half talks to the server half through the generated protocol, not
  # through an endpoint of its own.
  dartway_push_client: ^0.2.0
  dartway_serverpod_core_flutter: ^0.11.0
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
