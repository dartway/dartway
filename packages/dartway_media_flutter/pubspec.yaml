name: dartway_media_flutter
description: "A video/audio player for a DartWay app, reached as dw.plugins.media: one controller API over video_player and just_audio, a session that survives route changes, queue, resume, fullscreen and a mini-player — mechanism only, no chewie, no look."
version: 0.1.0
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, media, video, audio, flutter]

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  clock: ^1.1.0
  dartway_core_flutter: ^0.21.0-dev.13
  flutter_riverpod: ^3.0.0
  just_audio: ^0.10.5
  video_player: ^2.14.0
  wakelock_plus: ^1.5.2
  # `testing.dart`'s fakes speak the same platform protocol video_player and
  # just_audio do — declared rather than reached transitively, since they are
  # used by name. `flutter_test` answers the audio-session channel just_audio
  # waits on in a widget test; only `testing.dart` imports it.
  video_player_platform_interface: ^6.9.0
  just_audio_platform_interface: ^4.6.0
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  wakelock_plus_platform_interface: ^1.7.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
