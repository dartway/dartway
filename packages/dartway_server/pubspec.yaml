name: dartway_server
description: The DartWay application server — WebSocket protocol, handlers, auth, channels and jobs.
version: 1.0.0-dev.1
repository: https://github.com/dartway/dartway
license: Apache-2.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.11.0
dependencies:
  collection: ^1.19.0
  crypto: ^3.0.6
  # For `DwTestServer.connectClient` in `package:dartway_server/testing.dart`
  # only; production code never imports it.
  dartway_client: ^1.0.0-dev.1
  dartway_core: ^1.0.0-dev.1
  dartway_orm: ^1.0.0-dev.1
  http: ^1.4.0
  meta: ^1.16.0
  relic: 2.0.0-rc.1
  web_socket: ^1.0.1
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
