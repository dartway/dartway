name: dartway_push_firebase
description: "Firebase Cloud Messaging transport for DartWay push on Android, iOS and web — tokens, permission, opened notifications, and a web service worker whose click opens the notification's link."
version: 0.3.0-dev.1
repository: https://github.com/dartway/dartway
homepage: https://dartway.dev
issue_tracker: https://github.com/dartway/dartway/issues
topics: [dartway, push, notifications, firebase, fcm]
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  dartway_push_flutter: ^0.3.0-dev.1

  # Both majors that active projects run: U90 is on firebase_core 3.
  firebase_core: ">=3.13.1 <5.0.0"
  firebase_messaging: ">=15.2.5 <17.0.0"

  # Only reached on web, where the service worker hands the click back
  # through postMessage.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
