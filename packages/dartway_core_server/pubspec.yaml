name: dartway_core_server
description: The DartWay application server — HTTP calls per DTO, the live update socket, handlers, auth, channels and jobs, on dart:io.
version: 0.20.0-dev.1
repository: https://github.com/dartway/dartway
license: Apache-2.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.11.0
dependencies:
  crypto: ^3.0.6
  # For `testing.dart` only: `DwTestServer.connectClient` hands a test the real
  # client over real HTTP and the real socket. Pure Dart, so a server that
  # never runs a test carries nothing platform-bound.
  dartway_client: ^0.20.0-dev.1
  dartway_core_shared: ^0.20.0-dev.1
  dartway_orm: ^0.20.0-dev.1
  meta: ^1.16.0
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
